name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish an unsigned prerelease for this vX.Y.Z tag from main (leave empty for a plain build)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  verify-package:
    name: Verify and package
    runs-on: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.LUMEN_SIGNING_RUNNER || 'windows-2025' }}
    timeout-minutes: 120
    outputs:
      tag: ${{ steps.mode.outputs.tag }}
      signed: ${{ steps.mode.outputs.signed }}
    env:
      CARGO_TERM_COLOR: always
      LUMEN_PYTHON: python

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect release mode
        id: mode
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          SIGN_SHA1: ${{ vars.LUMEN_SIGN_CERT_SHA1 }}
          SIGN_SUBJECT: ${{ vars.LUMEN_SIGN_CERT_SUBJECT }}
          SIGN_STORE: ${{ vars.LUMEN_SIGN_CERT_STORE }}
          SIGN_TIMESTAMP: ${{ vars.LUMEN_SIGN_TIMESTAMP_URL }}
        run: |
          # A release is a v* tag push or a manual run on main naming the tag. The signed path
          # needs the complete signing identity and only ever runs for pushed tags; every other
          # release is an unsigned prerelease.
          $tag = ''
          if ($env:EVENT_NAME -eq 'push' -and $env:REF.StartsWith('refs/tags/v')) { $tag = $env:REF_NAME }
          elseif ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:INPUT_TAG) {
            if ($env:REF -ne 'refs/heads/main') { throw 'Manual releases can only run from main' }
            $tag = $env:INPUT_TAG
          }
          if ($tag -and $tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Release tag must look like vX.Y.Z: $tag" }
          $identity = $env:SIGN_SHA1 -and $env:SIGN_SUBJECT -and $env:SIGN_STORE -and $env:SIGN_TIMESTAMP
          $signed = [bool]($tag -and $env:EVENT_NAME -eq 'push' -and $identity)
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "signed=$($signed.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "tag='$tag' signed=$signed"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-11
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri -> target
            lumen-agent-core -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify product versions
        env:
          RELEASE_TAG: ${{ steps.mode.outputs.tag }}
        run: bun scripts/release.ts version

      - name: Require existing release signing identity before release work
        if: steps.mode.outputs.signed == 'true'
        env:
          RELEASE_TAG: ${{ steps.mode.outputs.tag }}
          LUMEN_SIGN_CERT_SHA1: ${{ vars.LUMEN_SIGN_CERT_SHA1 }}
          LUMEN_SIGN_CERT_SUBJECT: ${{ vars.LUMEN_SIGN_CERT_SUBJECT }}
          LUMEN_SIGN_CERT_STORE: ${{ vars.LUMEN_SIGN_CERT_STORE }}
          LUMEN_SIGN_TIMESTAMP_URL: ${{ vars.LUMEN_SIGN_TIMESTAMP_URL }}
        run: bun run release:preflight

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run unit tests
        run: bun run test

      - name: Run native answer bridge tests
        run: bun run test:answer-bridge

      - name: Run native performance, dev server and WinSearch tooling tests
        run: bun run test:tooling

      - name: Qualify production profiling in Edge
        run: bun run test:performance
        timeout-minutes: 5

      - name: Preserve production profiling samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumen-production-profile-${{ github.run_id }}
          path: test-results/performance-results.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Edge functional tests in development mode
        run: bun run test:e2e
        timeout-minutes: 45

      - name: Stage sidecars and independently pinned WinSearch runtime
        run: bun run stage:sidecars

      - name: Verify real vendor signatures and reject modified PE bytes
        run: powershell.exe -NoProfile -File scripts/test-release-signatures.ps1

      - name: Verify actual sparse identity metadata and signing admission
        run: powershell.exe -NoProfile -File scripts/test-identity-package.ps1

      - name: Verify pinned Gateway matches compiled native admission
        working-directory: src-tauri
        run: cargo test --all-features -j 1 pinned_gateway_digest_matches_compiled_admission -- --ignored --test-threads=1

      - name: Verify pinned workers and staging integrity
        run: bun test workers/rivet-wasm.test.ts scripts/stage-rivet-engine.test.ts scripts/stage-windows-ai.test.ts workers/enrichment-queue.test.ts workers/improvement-queue.test.ts workers/lease-deadline.test.ts

      - name: Verify compiled enrichment recovery
        env:
          LUMEN_COMPILED_ENRICHMENT_TEST: '1'
        run: bun test workers/enrichment-runtime.test.ts

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --all-features

      - name: Check Agent Core formatting
        run: cargo fmt --manifest-path lumen-agent-core/Cargo.toml --all -- --check

      - name: Run Agent Core Clippy
        run: cargo clippy --manifest-path lumen-agent-core/Cargo.toml --locked --all-targets -- -D warnings

      - name: Verify native Memory Core and both shared harness clients
        run: bun run test:agent-core

      - name: Verify owned WinSearch release startup, Stop and profile isolation
        working-directory: src-tauri
        run: cargo test --all-features -j 1 engine_native_ -- --ignored --test-threads=1

      - name: Verify compiled native enrichment consumer
        working-directory: src-tauri
        run: cargo test --all-features -j 1 compiled_enrichment_consumer -- --ignored --test-threads=1

      - name: Verify compiled native enrichment ownership and restart
        working-directory: src-tauri
        run: cargo test --all-features -j 1 rivet_worker_ -- --ignored --test-threads=1

      - name: Verify compiled improvement queue crash recovery and fencing
        working-directory: src-tauri
        run: cargo test --all-features -j 1 improvement_worker_recovers_crash_and_fences_old_generation -- --ignored --test-threads=1

      - name: Verify native answers in Edge
        run: bun run test:answer-native
        timeout-minutes: 5

      - name: Build installers (NSIS and MSI)
        if: steps.mode.outputs.signed != 'true'
        run: bun run tauri build

      - name: Build and verify signed release payload
        if: steps.mode.outputs.signed == 'true'
        env:
          RELEASE_TAG: ${{ steps.mode.outputs.tag }}
          LUMEN_SIGN_CERT_SHA1: ${{ vars.LUMEN_SIGN_CERT_SHA1 }}
          LUMEN_SIGN_CERT_SUBJECT: ${{ vars.LUMEN_SIGN_CERT_SUBJECT }}
          LUMEN_SIGN_CERT_STORE: ${{ vars.LUMEN_SIGN_CERT_STORE }}
          LUMEN_SIGN_TIMESTAMP_URL: ${{ vars.LUMEN_SIGN_TIMESTAMP_URL }}
        run: bun run release:build

      - name: Verify installer artifacts
        shell: pwsh
        env:
          SIGNED: ${{ steps.mode.outputs.signed }}
        run: |
          $nsis = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *-setup.exe -File)
          if ($nsis.Count -ne 1 -or $nsis[0].Length -eq 0) {
            throw "Expected one non-empty NSIS installer; found $($nsis.Count)"
          }
          $nsis | Select-Object FullName, Length
          if ($env:SIGNED -ne 'true') {
            $msi = @(Get-ChildItem src-tauri/target/release/bundle/msi -Filter *.msi -File)
            if ($msi.Count -ne 1 -or $msi[0].Length -eq 0) {
              throw "Expected one non-empty MSI installer; found $($msi.Count)"
            }
            $msi | Select-Object FullName, Length
          }

      - name: Smoke-test MSI install and uninstall
        if: steps.mode.outputs.signed != 'true'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem src-tauri/target/release/bundle/msi -Filter *.msi -File)[0].FullName
          $lock = Get-Content src-tauri/winsearch-payload.lock.json -Raw | ConvertFrom-Json
          function Invoke-Msi([string[]]$Arguments, [string]$Log) {
            $process = Start-Process msiexec.exe -ArgumentList $Arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              if (Test-Path $Log) { Get-Content $Log -Tail 120 }
              throw "msiexec $($Arguments -join ' ') failed with exit code $($process.ExitCode)"
            }
          }
          $installLog = Join-Path $env:RUNNER_TEMP 'msi-install.log'
          Invoke-Msi @('/i', "`"$msi`"", '/qn', '/norestart', '/L*v', "`"$installLog`"") $installLog
          $installRoot = Join-Path $env:ProgramFiles 'Lumen'
          if (-not (Test-Path (Join-Path $installRoot 'lumen.exe'))) { throw "lumen.exe was not installed under $installRoot" }
          $manifest = Join-Path $installRoot 'binaries/winsearch/payload.json'
          if (-not (Test-Path $manifest)) { throw 'The WinSearch payload manifest was not installed' }
          foreach ($name in 'winsearchd.exe', 'winsearch-embed.exe', 'winsearch-extract.exe') {
            if (-not (Test-Path (Join-Path $installRoot "binaries/winsearch/$name"))) { throw "$name was not installed" }
          }
          $installedManifest = (Get-FileHash -Algorithm SHA256 $manifest).Hash.ToLowerInvariant()
          if ($installedManifest -ne $lock.manifestSha256) {
            throw "Installed WinSearch manifest $installedManifest does not match the pinned $($lock.manifestSha256)"
          }
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'msi-uninstall.log'
          Invoke-Msi @('/x', "`"$msi`"", '/qn', '/norestart', '/L*v', "`"$uninstallLog`"") $uninstallLog
          if (Test-Path (Join-Path $installRoot 'lumen.exe')) { throw 'lumen.exe remained after uninstall' }

      - name: Write release checksums
        if: steps.mode.outputs.signed != 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *-setup.exe -File) +
            @(Get-ChildItem src-tauri/target/release/bundle/msi -Filter *.msi -File)
          $lines = $files | ForEach-Object { '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant(), $_.Name }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'release-assets/SHA256SUMS'), (($lines -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))
          Get-Content release-assets/SHA256SUMS

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumen-windows-x64-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            release-assets/SHA256SUMS
            .build/release/verified.json
            .build/release/seal.json
            .build/release/provenance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload failed Edge diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumen-edge-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish release
    if: needs.verify-package.outputs.tag != ''
    needs: verify-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lumen-windows-x64-${{ github.sha }}
          path: installers

      - name: Publish signed GitHub Release
        if: needs.verify-package.outputs.signed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CERT_SHA1: ${{ vars.LUMEN_SIGN_CERT_SHA1 }}
        run: |
          mapfile -t nsis < <(find installers -type f -name '*-setup.exe' -print)
          mapfile -t reports < <(find installers -type f -name 'verified.json' -print)
          if [[ ${#nsis[@]} -ne 1 || ! -s "${nsis[0]}" ]]; then
            printf 'Expected exactly one non-empty NSIS installer, found %s\n' "${#nsis[@]}" >&2
            exit 1
          fi
          [[ ${#reports[@]} -eq 1 && -n "$RELEASE_CERT_SHA1" ]]
          jq -e --arg version "${GITHUB_REF_NAME#v}" --arg filename "$(basename "${nsis[0]}")" --arg cert "$RELEASE_CERT_SHA1" \
            '.version == 1 and .productVersion == $version and .filename == $filename and .owner.thumbprint == $cert and (.binding | startswith("lumen-release-v1:"))' "${reports[0]}"
          expected=$(jq -er '.sha256 | select(test("^[a-f0-9]{64}$"))' "${reports[0]}")
          printf '%s  %s\n' "$expected" "${nsis[0]}" | sha256sum --check --strict
          gh release create "$GITHUB_REF_NAME" "${nsis[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Lumen $GITHUB_REF_NAME"

      - name: Publish unsigned prerelease
        if: needs.verify-package.outputs.signed != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-package.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mapfile -t nsis < <(find installers -type f -name '*-setup.exe' -print)
          mapfile -t msi < <(find installers -type f -name '*.msi' -print)
          mapfile -t sums < <(find installers -type f -name 'SHA256SUMS' -print)
          if [[ ${#nsis[@]} -ne 1 || ! -s "${nsis[0]}" || ${#msi[@]} -ne 1 || ! -s "${msi[0]}" || ${#sums[@]} -ne 1 ]]; then
            printf 'Expected one NSIS installer, one MSI and one SHA256SUMS; found %s/%s/%s\n' "${#nsis[@]}" "${#msi[@]}" "${#sums[@]}" >&2
            exit 1
          fi
          # The release assets must be exactly the bytes whose checksums were recorded by the build.
          checked=0
          while read -r sum name; do
            [[ -n "$name" ]] || continue
            file=$(find installers -type f -name "$name" -print)
            [[ -n "$file" && "$(printf '%s\n' "$file" | wc -l)" -eq 1 ]]
            printf '%s  %s\n' "$sum" "$file" | sha256sum --check --strict
            checked=$((checked + 1))
          done < "${sums[0]}"
          [[ $checked -eq 2 ]]
          {
            printf '**Unsigned prerelease.** These installers are not code-signed, so Windows SmartScreen will warn before running them.\n\n'
            printf 'Verify the downloads against `SHA256SUMS` before installing:\n\n```\n'
            cat "${sums[0]}"
            printf '```\n\n'
            printf -- '- `%s`: per-user installer\n- `%s`: per-machine MSI (installs to Program Files, needs administrator rights)\n\n' "$(basename "${nsis[0]}")" "$(basename "${msi[0]}")"
            printf 'Both installers bundle the pinned, hash-verified WinSearch engine. Built from commit `%s`.\n' "$GITHUB_SHA"
          } > release-notes.md
          args=(--repo "$GITHUB_REPOSITORY" --prerelease --title "Lumen $RELEASE_TAG (unsigned)" --notes-file release-notes.md)
          if [[ "$EVENT_NAME" == "push" ]]; then args+=(--verify-tag); else args+=(--target "$GITHUB_SHA"); fi
          gh release create "$RELEASE_TAG" "${nsis[0]}" "${msi[0]}" "${sums[0]}" "${args[@]}"
