[package]
name = "lumen-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Tauri-free core services for Lumen search, indexing, AI answers, Computer Use, and settings"

[dependencies]
lumen-agent-core = { path = "../../lumen-agent-core/crates/lumen-agent-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
directories = "6"
futures-util = "0.3"
notify = "=8.2.0"
pdf-extract = "0.12.0"
quick-xml = "0.41.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.40.1", features = ["bundled", "load_extension", "functions", "collation", "trace"] }
sha2 = "0.11.0"
thiserror = "2"
ws-client = { git = "https://github.com/KB01111/WinSearch-lumen-engine.git", rev = "85a915d460b1fa751bbe86f289ff77c18c032c25" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "net", "macros"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
